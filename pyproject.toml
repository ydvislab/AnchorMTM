[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anchormtm"
version = "1.0.0"
description = "AnchorMTM: merge tree maps anchored to a spatial reference, with code and results of the paper"
requires-python = ">=3.10"
dependencies = [
  "numpy==2.0.2",
  "scipy==1.13.1",
  "matplotlib==3.9.4",
  "Pillow==12.3.0",
  "netCDF4==1.7.4",
  "pandas==3.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
volume3d = ["hilbertcurve==2.0.5", "py7zr==1.1.4", "requests==2.34.2"]
solvers = ["osqp==1.1.3", "clarabel==0.11.1", "threadpoolctl==3.8.0"]
era5 = ["xarray==2026.9.0", "zarr==3.4.1", "gcsfs==2026.10.1"]

